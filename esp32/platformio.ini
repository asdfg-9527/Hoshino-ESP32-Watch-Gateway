[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; U8g2 只被状态屏代码引用；当 HOSHINO_ENABLE_DISPLAY=0 时不会被链接进固件。
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  sh123/esp32_opus
  olikraus/U8g2 @ ^2.36.12
; 4MB / huge_app 环境默认启用 0.96" SSD1306 状态屏（I2C SDA=GPIO21, SCL=GPIO22）。
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_LWIP_IP_FORWARD=1
  -DCONFIG_LWIP_IPV4_NAPT=1
  -DCONFIG_LWIP_L2_TO_L3_COPY=1
  -DIP_NAPT_MAX=16
  -DIP_PORTMAP_MAX=1
  -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=4096
  -DHOSHINO_ENABLE_DISPLAY=1

[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv

; WROVER 环境：带 8MB PSRAM，蓝牙+WiFi+网络桥内存充足
[env:esp32-wrover]
board = esp-wrover-kit
board_build.partitions = huge_app.csv

; WROOM 低内存 ESP-IDF 构建：Arduino 作为 ESP-IDF 组件，
; sdkconfig.defaults 真正参与 WiFi/BT 栈编译（BR/EDR Only + WiFi Minimum）。
; 这是推荐的构建目标：Wi-Fi 用 Minimum 缓冲配置，才能在蓝牙 + NAPT 之后
; 仍然 esp_wifi_init 成功（纯 Arduino 的 esp32dev 环境会因内存不足失败）。
;
; 4MB 板用 huge_app.csv，因此状态屏（0.96" SSD1306, SDA=GPIO21, SCL=GPIO22）保持开启。
; 2MB 板要省空间：把 board_build.partitions 换回 bare_minimum_2MB.csv 并把
; HOSHINO_ENABLE_DISPLAY 改成 0（屏幕代码整块编译掉，U8g2 不参与链接）。
[env:wroom_lowmem_idf]
board = esp32dev
framework = espidf, arduino
board_build.partitions = huge_app.csv
upload_port = COM3
build_flags =
  -Wno-error
  -Wno-error=maybe-uninitialized
  -Wno-error=unused-variable
  -Wno-error=unused-function
  -Wno-maybe-uninitialized
  -DIP_NAPT_MAX=16
  -DIP_PORTMAP_MAX=1
  -DHOSHINO_ENABLE_DISPLAY=1


[env:esp32dev_bt_baseline]
board = esp32dev
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=4
  -DHOSHINO_DISABLE_LWIP_OVERRIDE=1
lib_ignore =
  hoshino-lwip-napt-override
